[platformio]
default_envs = jc3636w518c
src_dir = firmware/platformio

[env:waveshare_146]
; Pinned PlatformIO-compatible distribution of Espressif Arduino core 3.3.11.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:firmware/tools/pio_upload.py
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNAV_WAVESHARE_146=1
    ; Experiment: lower AA raster cost without shrinking the physical UI.
    -DNAVIO_RENDER_SIZE=360

lib_deps =
    adafruit/Adafruit GFX Library @ 1.13.0
    adafruit/Adafruit BusIO @ 1.17.4
    moononournation/GFX Library for Arduino @ 1.6.9
    bblanchon/ArduinoJson @ 7.4.3
upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
monitor_filters = time, esp32_exception_decoder

[env:jc3636w518c]
extends = env:waveshare_146
; JC3636W518C: ST77916 360x360, direct GPIO47 reset, not TCA9554.
upload_speed = 460800
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNAV_WAVESHARE_146=0
    -DNAV_JC3636W518C=1
    -DNAVIO_RENDER_SIZE=360

[env:jc3636_panel_diagnostic]
extends = env:jc3636w518c
; Temporary display-only diagnostic: no BLE, navigation or NVS access.
build_src_filter = +<main.cpp>
build_flags =
    ${env:jc3636w518c.build_flags}
    -DNAVIO_PANEL_DIAGNOSTIC=1

[env:jc3636_factory_monitor]
extends = env:jc3636w518c
; Monitor only: the restored original binary has no matching NAVIO ELF.
monitor_filters = time

