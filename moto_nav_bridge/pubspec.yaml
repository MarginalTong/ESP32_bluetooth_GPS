name: moto_nav_bridge
description: NAVIO motorcycle navigation and ESP32 BLE display companion.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  supabase_flutter: 2.18.3
  sign_in_with_apple: 8.2.0
  google_sign_in: 7.2.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter:
    sdk: flutter
  # BLE — communicates with the NAVIO display (write-with-response).
  flutter_blue_plus: ^1.32.12
  # Continuous location tracking for the navigation engine.
  geolocator: ^12.0.0
  # Routing API calls; AbortableRequest cancels timed-out Valhalla requests.
  http: ^1.5.0
  # HMAC-SHA256 for authenticated writes to the display (PacketSigner).
  crypto: ^3.0.7
  vector_tile: ^4.0.0
  # Simple state management for the UI layer.
  provider: ^6.1.2
  # Android Keystore-backed storage for the display pairing key. iOS uses the
  # app's own Keychain channel (ios/Runner/AppDelegate.swift).
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Already pinned by flutter_test; declared for timer-driven controller tests.
  fake_async: ^1.3.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/auth/google-g.png
